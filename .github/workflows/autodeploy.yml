# Automatic server updates (Abdullah 2026-11-09 "yes"; orch/AUTODEPLOY.md). When a commit on main has ALL gate/* statuses
# green and changed simulation files, servers-live is advanced to it and deploy-servers.yml runs. Kill switch:
# orch/AUTODEPLOY = off (file on main) or repository variable AUTODEPLOY = off. No secrets used; only the built-in GITHUB_TOKEN.
# (Pushes made with GITHUB_TOKEN do not start other workflows, so this one starts deploy-servers.yml itself.)
name: Autodeploy servers
on:
  schedule: [{ cron: '7,22,37,52 * * * *' }]
  push: { branches: [main] }
  workflow_dispatch: {}
permissions:
  contents: write
  statuses: read
  pull-requests: write
  actions: write
concurrency: { group: autodeploy, cancel-in-progress: false }
jobs:
  autodeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Decide and advance servers-live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAR_OFF: ${{ vars.AUTODEPLOY }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          note() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          [ "${VAR_OFF:-}" = off ] && { note "autodeploy: OFF (repository variable AUTODEPLOY=off)"; exit 0; }
          [ "$(tr -d ' \r\n' < orch/AUTODEPLOY 2>/dev/null)" = off ] && { note "autodeploy: OFF (orch/AUTODEPLOY says off)"; exit 0; }
          git fetch -q origin servers-live 2>/dev/null || { note "autodeploy: no servers-live branch - nothing to do"; exit 0; }
          LIVE=$(git rev-parse origin/servers-live)
          # required gates = the matrix of the gate workflow on main
          REQ=$(python3 - <<'PY'
          import re
          t=open('.github/workflows/gate.yml').read()
          m=re.search(r'^\s*t:\s*\[(.*?)\]',t,re.S|re.M)
          print(' '.join(x.strip() for x in m.group(1).split('#')[0].replace('\n',' ').split(',') if x.strip()))
          PY
          )
          [ -n "$REQ" ] || { note "autodeploy: cannot read the gate list - stopping"; exit 1; }
          PICK=""
          for H in $(git rev-list --first-parent -n 25 origin/main); do
            [ "$H" = "$LIVE" ] && break
            git merge-base --is-ancestor "$H" origin/servers-live && break
            J=$(gh api "repos/$REPO/commits/$H/statuses?per_page=100" 2>/dev/null) || continue
            if printf '%s' "$J" | REQ="$REQ" python3 -c '
          import json,sys,os
          s={}
          for x in json.load(sys.stdin):
              if x["context"].startswith("gate/"): s.setdefault(x["context"][5:],x["state"])
          sys.exit(0 if all(s.get(k)=="success" for k in os.environ["REQ"].split()) else 1)'; then PICK=$H; break; fi
          done
          [ -n "$PICK" ] || { note "autodeploy: no recent main commit has every gate green - nothing to deploy"; exit 0; }
          if git diff --quiet "$LIVE" "$PICK" -- 'src/01*' 'src/02*' 'src/03*' 'src/07*' server/; then
            note "autodeploy: $PICK is all-green but changed no simulation/server files since servers-live - nothing to deploy"; exit 0; fi
          note "autodeploy: ${PICK:0:10} has every gate green and changed simulation files"
          NEW=""
          if git merge-base --is-ancestor "$LIVE" "$PICK"; then NEW=$PICK; how="fast-forward"
          else
            LT=$(git rev-parse "$LIVE^{tree}")
            if git log --format=%T -n 4000 origin/main | grep -qx "$LT"; then
              NEW=$(git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
                commit-tree "$PICK^{tree}" -p "$LIVE" -p "$PICK" -m "Autodeploy: main $PICK to servers-live (tree identical to main)"); how="merge commit with main's exact tree"
            fi
          fi
          if [ -n "$NEW" ] && git push -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$NEW:refs/heads/servers-live" 2>push.err; then
            note "autodeploy: servers-live advanced ($how) to ${NEW:0:10}; starting deploy-servers"
            gh workflow run deploy-servers.yml --ref servers-live -R "$REPO" || note "autodeploy: could not start deploy-servers (Cloudflare's own builder may still pick up the push)"
            exit 0
          fi
          note "autodeploy: cannot advance servers-live without rewriting history or the push was refused ($(tr -d '\n' < push.err 2>/dev/null | sed 's#x-access-token:[^@]*@##' | cut -c1-160)) - falling back to the pull request"
          open=$(gh pr list -R "$REPO" --base servers-live --head main --state open --json number -q '.[0].number' 2>/dev/null)
          if [ -n "$open" ]; then note "autodeploy: pull request #$open (main -> servers-live) is already open - waiting for Abdullah to merge it"; exit 0; fi
          gh pr create -R "$REPO" --base servers-live --head main --title "main -> servers-live (servers need the new simulation)" \
            --body "All gates are green on ${PICK:0:10} and it changed simulation files. Automatic update could not fast-forward servers-live, so tap Merge to deploy. See orch/AUTODEPLOY.md." \
            && note "autodeploy: opened the main -> servers-live pull request" || note "autodeploy: could not open the pull request (GitHub Actions may not be allowed to create pull requests: Settings > Actions > General > Workflow permissions)"
          exit 0
