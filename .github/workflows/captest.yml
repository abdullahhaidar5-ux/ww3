# Unit-cap measurement (orch/capprobe.mjs, report orch/reports/captest.md). Runs only on branch orch/captest. Measurement only.
name: Cap test
on:
  push:
    branches: ['orch/captest']
permissions: { contents: read }
jobs:
  m:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { players: 2, per: 300, fill: pop }
          - { players: 2, per: 500, fill: pop }
          - { players: 8, per: 300, fill: pop }
          - { players: 8, per: 500, fill: pop }
          - { players: 2, per: 300, fill: units }
          - { players: 2, per: 500, fill: units }
          - { players: 8, per: 300, fill: units }
          - { players: 8, per: 500, fill: units }
    env: { PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probe
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.63.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node orch/capprobe.mjs --players ${{ matrix.players }} --per ${{ matrix.per }} --fill ${{ matrix.fill }} --out cap.json 2>&1 | tail -40
          echo "=====JSON====="; python3 -c "import json;print(json.dumps(json.load(open('cap.json'))))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cap-${{ matrix.players }}p-${{ matrix.per }}-${{ matrix.fill }}
          path: cap.json
