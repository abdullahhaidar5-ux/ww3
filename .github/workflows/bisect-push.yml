# Manual bisect of one gate test: push a branch named  bisect/<test>/<good-sha>  whose tip is the known-bad commit.
# Example: git push origin <bad-sha>:refs/heads/bisect/smooth-mp/3364ee9f   (test names = gate names, orch/bisect.sh)
# Result: a commit comment on the bad commit and the job summary. Free runners, no model tokens.
name: Bisect (manual)
on:
  push:
    branches: ['bisect/**']
permissions:
  contents: read
  statuses: read
  actions: read
  pull-requests: read
jobs:
  bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env: { GH_TOKEN: '${{ github.token }}', PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Bisect
        run: |
          REF='${{ github.ref_name }}'; T=$(echo "$REF" | cut -d/ -f2); GOODSHA=$(echo "$REF" | cut -d/ -f3)
          BAD=$(git rev-parse HEAD)
          git fetch -q origin main
          GOOD=$(git rev-parse "$GOODSHA")
          npm i --no-save --no-audit --no-fund playwright@1.63.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          (cd server && npm ci --no-audit --no-fund >/dev/null) || true
          cp orch/bisect.sh /tmp/bisect.sh; R=$(BISECT_GOOD=$GOOD bash /tmp/bisect.sh "$BAD" "$T" | tail -1)
          echo "$R"; echo "Bisect $T: $R" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/$GITHUB_REPOSITORY/commits/$BAD/comments" -f body="Manual bisect of **$T** between ${GOODSHA} and ${BAD:0:10}: first bad commit → \`${R#BISECT }\`." >/dev/null || true
