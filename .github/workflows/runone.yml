# Run ONE gate test on exactly this commit: push a branch named  runone/<test>  (e.g. runone/smooth-mp). Free runner, no model tokens.
name: Run one test
on:
  push:
    branches: ['runone/**']
permissions: { contents: read }
jobs:
  one:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: { PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test
        run: |
          T=$(echo '${{ github.ref_name }}' | cut -d/ -f2)
          npm i --no-save --no-audit --no-fund playwright@1.63.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          case "$T" in smooth-*) node orch/smooth.mjs --profile "${T#smooth-}" ;; *) node "orch/$T.mjs" ;; esac 2>&1 | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"
