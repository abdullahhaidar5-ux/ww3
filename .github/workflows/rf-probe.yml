# Branch-only probe for the Test-range stall (orch/rangefreeze.mjs): push to probe/rf/** runs just that test, a few ways. Changes nothing else.
name: rangefreeze probe
on:
  push:
    branches: ['probe/rf/**']
jobs:
  rf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        v: [a1, a2, a3, a4, b1, b2, c1, c2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tools
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.63.0 >/dev/null
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright install --with-deps chromium >/dev/null
      - name: Run ${{ matrix.v }}
        env: { PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers }
        run: |
          case '${{ matrix.v }}' in
            a*) TRIES=1 node orch/rangefreeze.mjs IR ;;
            b*) TRIES=1 node orch/rangefreeze.mjs OB ;;
            c*) TRIES=1 node orch/rangefreeze.mjs RS ;;
          esac
          true
