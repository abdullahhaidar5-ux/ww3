# World War 3 multiplayer servers (lobby, relay rooms, TURN logins). See README.md.
# Deployed by Cloudflare Workers Builds from the `servers-live` branch, root directory `server`.
# This is a separate Worker from `ww3` (the static game site): never rename it to `ww3`.
name = "ww3-servers"
main = "src/index.js"
compatibility_date = "2026-03-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

# SQLite-backed Durable Objects: the kind the Workers Free plan allows.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "Lobby", "Budget"]

# Optional, set in the Cloudflare dashboard (Worker > Settings > Variables and Secrets), never in this file:
#   TURN_KEY_ID, TURN_KEY_API_TOKEN  (secrets)  Cloudflare TURN key, for players behind strict networks
#   ALLOWED_ORIGINS                  (text)     extra sites allowed to use the servers, comma-separated
