<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WORLD WAR 3 — Official Gameplay Trailer</title>
  <meta name="description" content="Real-time modern warfare in your browser. 22 playable nations, hyper-realistic PBR armor & buildings, unique superweapons. Play free on Desktop & Mobile.">
  <meta property="og:title" content="WORLD WAR 3 — Official Gameplay Trailer">
  <meta property="og:description" content="22 Playable Nations • Hyper-Realistic PBR Warfare • SCUD Storms, Orbital Particle Cannons & Tactical Nukes">
  <meta property="og:image" content="https://abdullahhaidar5-ux.github.io/ww3/trailer_poster.jpg">
  <meta property="og:type" content="video.other">
  <meta property="og:video" content="https://abdullahhaidar5-ux.github.io/ww3/ww3_trailer.mp4">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root { --bg:#070b10; --panel:#0d141d; --gold:#f5b82e; --text:#f3f6fa; --muted:#97a8bc; --line:rgba(245,184,46,.32); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      min-height:100vh; background:radial-gradient(ellipse at top,#131e2c 0%,var(--bg) 68%);
      color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 16px;
    }
    .wrap { width:100%; max-width:1120px; display:flex; flex-direction:column; gap:18px; }
    header { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:10px; }
    h1 { font-size:clamp(26px,4vw,42px); font-weight:800; letter-spacing:.08em; }
    h1 span { color:var(--gold); }
    .tag { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:13px; color:var(--muted); letter-spacing:.12em; text-transform:uppercase; }
    .player {
      width:100%; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden;
      border:1px solid var(--line); box-shadow:0 24px 64px rgba(0,0,0,.72);
    }
    video { width:100%; height:100%; display:block; background:#000; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
    .btns { display:flex; flex-wrap:wrap; gap:10px; }
    .btn {
      display:inline-flex; align-items:center; justify-content:center; padding:12px 22px; border-radius:6px;
      font-weight:700; letter-spacing:.06em; text-decoration:none; font-size:14px; text-transform:uppercase;
      transition:transform .12s ease,filter .12s ease;
    }
    .btn:hover { transform:translateY(-1px); filter:brightness(1.08); }
    .btn-play { background:var(--gold); color:#090d13; }
    .btn-sec { background:var(--panel); color:var(--text); border:1px solid rgba(255,255,255,.16); }
    .meta { font-size:13px; color:var(--muted); }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>WORLD WAR <span>3</span></h1>
      <div class="tag">Official Gameplay Trailer · 22 Nations · Real-Time Modern Warfare</div>
    </header>
    <div class="player">
      <video controls playsinline preload="metadata" poster="trailer_poster.jpg">
        <source src="ww3_trailer.mp4" type="video/mp4">
        Your browser does not support HTML5 video. <a href="ww3_trailer.mp4">Download the trailer MP4</a>.
      </video>
    </div>
    <div class="actions">
      <div class="btns">
        <a class="btn btn-play" href="./">Play Free Now (Desktop)</a>
        <a class="btn btn-sec" href="./?mobile=1">Play on Mobile</a>
        <a class="btn btn-sec" href="ww3_trailer.mp4" download="WW3_Trailer.mp4">Download MP4</a>
      </div>
      <div class="meta">720p HD · 30 FPS · Live Engine Gameplay</div>
    </div>
  </main>
</body>
</html>
