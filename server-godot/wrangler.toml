# World War 3 — Godot edition: lockstep relay (lobby + rooms). A separate Worker from `ww3` (the website) and
# `ww3-servers` (the browser game's servers). NOT deployed yet: see README.md "Deploying (ORCH)".
name = "ww3-godot-relay"
main = "src/index.js"
compatibility_date = "2026-03-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GodotRoom"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "GodotLobby"

# SQLite-backed Durable Objects: the kind the Workers Free plan allows.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GodotRoom", "GodotLobby"]

# Local tests only: `wrangler dev --var TEST_SPEED:1` lets the test harness speed the clock up (?turnms=10).
# Never set TEST_SPEED on the deployed Worker.
# Optional dashboard variable: ALLOWED_ORIGINS (extra web origins, comma-separated).
